<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <circle cx="1030" cy="150" r="180" fill="url(#glow)"/>

  <!-- faint circuit lines -->
  <g stroke="#334155" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M0 40 H180 L210 70 H420"/>
    <path d="M0 260 H140 L170 230 H360"/>
    <path d="M1200 60 H980 L950 90 H760"/>
    <path d="M1200 240 H1020 L990 210 H820"/>
  </g>
  <g fill="#475569">
    <circle cx="180" cy="40" r="3"/>
    <circle cx="420" cy="70" r="3"/>
    <circle cx="140" cy="260" r="3"/>
    <circle cx="980" cy="60" r="3"/>
    <circle cx="1020" cy="240" r="3"/>
  </g>

  <!-- central node: PR diff -->
  <g transform="translate(760,150)">
    <rect x="-70" y="-55" width="140" height="110" rx="10" fill="#0b1220" stroke="url(#accent1)" stroke-width="2"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#64748b">diff --git</text>
    <text x="-58" y="-8" font-family="Menlo, Consolas, monospace" font-size="13" fill="#34d399">+ fix(auth)</text>
    <text x="-58" y="12" font-family="Menlo, Consolas, monospace" font-size="13" fill="#f87171">- old_check()</text>
    <text x="-58" y="32" font-family="Menlo, Consolas, monospace" font-size="13" fill="#38bdf8">+ new_check()</text>
  </g>

  <!-- four agent nodes around it -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">
    <!-- Security -->
    <g transform="translate(940,60)">
      <line x1="-70" y1="30" x2="-10" y2="70" stroke="url(#accent1)" stroke-width="2"/>
      <circle r="34" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e2e8f0" font-size="20">🔒</text>
    </g>
    <!-- Performance -->
    <g transform="translate(1080,140)">
      <line x1="-100" y1="10" x2="-30" y2="10" stroke="url(#accent2)" stroke-width="2"/>
      <circle r="34" fill="#0b1220" stroke="#34d399" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e2e8f0" font-size="20">⚡</text>
    </g>
    <!-- Style -->
    <g transform="translate(940,240)">
      <line x1="-70" y1="-30" x2="-10" y2="-70" stroke="url(#accent1)" stroke-width="2"/>
      <circle r="34" fill="#0b1220" stroke="#818cf8" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e2e8f0" font-size="20">🎨</text>
    </g>
    <!-- Logic/Bugs -->
    <g transform="translate(870,150)">
      <line x1="-30" y1="0" x2="0" y2="0" stroke="url(#accent2)" stroke-width="2" opacity="0"/>
      <circle r="34" fill="#0b1220" stroke="#f472b6" stroke-width="2"/>
      <text y="5" text-anchor="middle" fill="#e2e8f0" font-size="20">🐛</text>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(60,110)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">AI PR Reviewer</text>
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#94a3b8">Multi-agent code review · self-improving over time</text>
    <rect x="0" y="52" width="120" height="6" rx="3" fill="url(#accent1)"/>
  </g>
</svg>
